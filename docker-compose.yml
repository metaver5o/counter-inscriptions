version: '3.8'

# counter-inscriptions — full stack
# Service names must be consistent: backend uses COUNTERPARTY_URL=http://counterparty-server:4000

services:

  # ── Bootstrap (one-shot, run manually before first start) ─────────────────
  # docker-compose --profile bootstrap run --rm counterparty-bootstrap
  counterparty-bootstrap:
    image: alpine:3.19
    container_name: counterinscriptions-bootstrap
    profiles: [bootstrap]
    volumes:
      - ./data/counterparty:/data
    environment:
      - NETWORK=${NETWORK:-mainnet}
    command: >
      sh -c "
        apk add --no-cache curl tar &&
        DB=/data/counterparty.db &&
        if [ -f \"$$DB\" ]; then
          echo '✓ DB exists ('$$(du -sh $$DB | cut -f1)'), skipping bootstrap.';
          exit 0;
        fi &&
        echo 'Bootstrapping Counterparty DB...' &&
        counterparty-server bootstrap ||
        (echo 'Fallback: running counterparty-server bootstrap inside main image...' && exit 1)
      "

  # ── Counterparty server (patched for all MIME types) ──────────────────────
  counterparty-server:
    build:
      context: .
      dockerfile: xcp-api-mime-Dockerfile
    container_name: counterinscriptions-counterparty
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "4000:4000"
    volumes:
      - ./data/counterparty:/root/.local/share/counterparty
      - ./data/counterparty-cache:/root/.cache/counterparty
      - ./config/server.conf:/root/.config/counterparty/server.conf
    environment:
      - FORCE=${FORCE:-0}
      - ENABLE_ALL_PROTOCOL_CHANGES=${ENABLE_ALL_PROTOCOL_CHANGES:-1}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/v2/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: counterinscriptions-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      counterparty-server:
        condition: service_healthy
    environment:
      # Must match service name above — NOT localhost
      - COUNTERPARTY_URL=http://counterparty-server:4000
      - PORT=3001

  # ── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: counterinscriptions-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api

  # ── Cloudflare Quick Tunnel (no account, temporary *.trycloudflare.com URL) 
  # docker-compose --profile quicktunnel up
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: counterinscriptions-tunnel-quick
    profiles: [quicktunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend

  # ── Cloudflare Persistent Tunnel (set TUNNEL_TOKEN in .env)
  # docker-compose --profile tunnel up
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: counterinscriptions-tunnel
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - frontend
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
