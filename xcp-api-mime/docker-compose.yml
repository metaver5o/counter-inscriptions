version: '3.8'

# xcp-api-mime standalone compose — the original working opus minter.
# Build context is xcp-api-mime/ so COPY paths in Dockerfile are relative to here.

services:
  xcp-api-mime:
    build:
      context: .          # <-- context is xcp-api-mime/ dir
      dockerfile: Dockerfile
    container_name: xcp-api-mime-service
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "4000:4000"
    volumes:
      - ../data/counterparty:/root/.local/share/counterparty
      - ../data/counterparty-cache:/root/.cache/counterparty
      - ./config/server.conf:/root/.config/counterparty/server.conf
    environment:
      - FORCE=${FORCE:-0}
      - ENABLE_ALL_PROTOCOL_CHANGES=${ENABLE_ALL_PROTOCOL_CHANGES:-1}

  # Lightweight mock Bitcoin RPC — lets xcp-api-mime start without a real Bitcoin node
  bitcoin-mock:
    image: node:18-alpine
    container_name: xcp-api-mime-bitcoin-mock
    restart: unless-stopped
    ports:
      - "4100:4100"
    command: >
      node -e "
        const http = require('http');
        http.createServer((req, res) => {
          let body = '';
          req.on('data', c => body += c);
          req.on('end', () => {
            res.writeHead(200, {'Content-Type':'application/json'});
            try {
              const j = JSON.parse(body);
              if (j.method === 'getblockchaininfo') return res.end(JSON.stringify({result:{blocks:933143,chain:'main'},error:null,id:j.id}));
              if (j.method === 'getblockcount')     return res.end(JSON.stringify({result:933143,error:null,id:j.id}));
              if (j.method === 'getblockhash')      return res.end(JSON.stringify({result:'000000000000000000008acbc751d3885d58d8393e8e2d424075191953245026',error:null,id:j.id}));
              res.end(JSON.stringify({result:{},error:null,id:j.id}));
            } catch(e) { res.end(JSON.stringify({error:'bad request'})); }
          });
        }).listen(4100, '0.0.0.0', () => console.log('Bitcoin mock RPC on :4100'));
      "
