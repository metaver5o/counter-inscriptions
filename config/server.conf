[Default]
# Network configuration (Hardcoded for Mainnet production snapshot)
network = mainnet
port = 4000
host = 0.0.0.0

# Backend data lookup providers
electrs-url = https://mempool.space/api
regtest = 0

# Increase max request body size to 50MB for large file uploads
max-message-size = 50000000

# API v2 (REST) - HTTP interface
api-port = 4000
api-host = 0.0.0.0

# API v1 (JSON-RPC)
rpc-host = 0.0.0.0

# Local SQLite backend settings
backend-name = sqlite3

# Protocol changes and features
enable_all_protocol_changes = true
ordinals_enabled = true
ordinal_fee_rate_satoshi_per_vbyte = 0.5