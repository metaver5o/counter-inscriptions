openapi: 3.0.3
info:
  title: Counter-Inscriptions API
  description: |
    API for minting counter-inscriptions on the Counter-Inscriptions network.

    ## Features

    - Mint single counter-inscription to a wallet
    - Mint any wallet (specify destination, pay from connected wallet)
    - Batch mint collections across multiple wallets
    - File uploads for attachments
    - Balance checks
    - Asset name generation

  version: 1.0.0
servers:
  - url: http://localhost:3001/api
    description: Local development server

tags:
  - name: Minting
    description: Counter-inscription minting operations
  - name: Wallet
    description: Wallet balance and operations
  - name: Utility
    description: Asset generation and health checks

paths:
  /mint:
    post:
      tags:
        - Minting
      summary: Mint a single counter-inscription
      description: |
        Mints a new counter-inscription asset to the specified wallet address.
        Can accept raw hex descriptions or file uploads.

      operationId: mintAsset
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                asset:
                  type: string
                  example: "0x7461703a2f696e736372697074696f6e74792f6b756b6961"
                  description: Asset identifier (hex or prefixed with 0x)
                quantity:
                  type: integer
                  example: 1
                  default: 1
                  description: Number of units to mint
                description:
                  type: string
                  example: "74617072"
                  description: |
                    Raw hex bytes for asset name (not URL-encoded).
                    Use raw hex characters like 'aabbcc' not '0xaabbcc'.
                  pattern: "^([a-fA-F0-9]| )+$"
                mime_type:
                  type: string
                  example: "text/plain"
                  description: MIME type for the asset (supports PATCH #3266 parameters)
                encoding:
                  type: string
                  example: "taproot"
                  default: "taproot"
                  enum:
                    - taproot
                    - witness_1
                  description: BIP-84 wallet serialization encoding
                sat_per_vbyte:
                  type: number
                  example: 2.01
                  description: Transaction fee rate in sat/vByte (default: 2)
                file:
                  type: string
                  format: binary
                  description: |
                    Optional attachment file for the counter-inscription.
                    Use multipart/form-data with this field to attach files.
              required:
                - asset
                - quantity
                - description
                - mime_type

      responses:
        '200':
          description: Mint operation succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  raw_tx:
                    type: string
                    format: hex
                    example: "0100000001abcdef..."
                    description: Unsigned transaction hex (ready to sign and broadcast)
                  asset:
                    type: string
                    example: "0x7461703a2f696e736372697074696f6e74792f6b756b6961"
                  wallet:
                    type: string
                    example: "bcq..."
        '400':
          description: Missing required fields
        '402':
          description: Insufficient funds for fees and asset registration
        '413':
          description: File too large for current block limits
        '503':
          description: Counterparty server unreachable

  /mint-any-wallet:
    post:
      tags:
        - Minting
      summary: Mint to any wallet address
      description: |
        Mints a counter-inscription to ANY specified wallet address.
        You still need to be connected to a wallet for signing, but the
        asset will be minted to the destination address you provide.

      operationId: mintAnyWallet
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                asset:
                  type: string
                  example: "0x7461703a2f696e736372697074696f6e74792f6b756b6961"
                quantity:
                  type: integer
                  example: 1
                  default: 1
                description:
                  type: string
                  example: "74617072"
                  pattern: "^([a-fA-F0-9]| )+$"
                mime_type:
                  type: string
                  example: "text/plain"
                encoding:
                  type: string
                  example: "taproot"
                  default: "taproot"
                sat_per_vbyte:
                  type: number
                  example: 2.01
                walletAddress:
                  type: string
                  example: "bcq..."
                  description: Destination wallet address (not paying wallet)

      responses:
        '200':
          description: Mint operation succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  raw_tx:
                    type: string
                    format: hex
                  asset:
                    type: string
                  wallet:
                    type: string
        '400':
          description: Missing required fields
        '402':
          description: Insufficient funds
        '503':
          description: Counterparty server unreachable

  /mint-collection:
    post:
      tags:
        - Minting
      summary: Batch mint collection to multiple wallets
      description: |
        Mints counter-inscriptions across a batch of wallet addresses.
        Each wallet receives one unit by default (adjustable via quantity_per_wallet).
        Returns detailed results for each mint operation.

      operationId: mintCollection
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                asset:
                  type: string
                  example: "0x7461703a2f696e736372697074696f6e74792f6b756b6961"
                quantity_per_wallet:
                  type: integer
                  example: 1
                  default: 1
                description:
                  type: string
                  example: "74617072"
                mime_type:
                  type: string
                  example: "text/plain"
                encoding:
                  type: string
                  example: "taproot"
                sat_per_vbyte:
                  type: number
                  example: 2.01
                walletAddresses:
                  type: string
                  description: Comma-separated list of destination wallet addresses
                  example: "bcq...,bcq....,bcq..."

      responses:
        '200':
          description: Batch mint completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  total:
                    type: integer
                    example: 3
                  succeeded:
                    type: integer
                    example: 3
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        wallet:
                          type: string
                        raw_tx:
                          type: string
                          format: hex
                        status:
                          type: string
                          enum: [success, failed]
                        error:
                          type: string
                          nullable: true
                  message:
                    type: string
                    example: "3/3 mint operations completed"
        '400':
          description: Missing required fields or invalid wallet list

  /upload:
    post:
      tags:
        - Utility
      summary: Upload file attachment
      description: |
        Uploads a file for attachment to counter-inscriptions.
        Supported formats include all MIME types (text, images, audio, video, PDF).

        The uploaded file is temporarily stored and its metadata returned.
        Use this along with /api/mint by including the file in multipart/form-data.

      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload

      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  filename:
                    type: string
                    example: "1736849234567-data.txt"
                  originalName:
                    type: string
                    example: "data.txt"
                  mimeType:
                    type: string
                    example: "text/plain"
                  size:
                    type: integer
                    example: 1024
        '400':
          description: No file uploaded or invalid file type

  /balance/{address}:
    get:
      tags:
        - Wallet
      summary: Get wallet balance
      description: |
        Fetches all asset balances for a given Bitcoin address from Counterparty.

      operationId: getBalance
      parameters:
        - in: path
          name: address
          required: true
          schema:
            type: string
            pattern: "^bc[0-9a-f]{38}$"
            example: "bcq..."
          description: Bitcoin address (bech32 for Taproot)

      responses:
        '200':
          description: Balance information retrieved
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '500':
          description: Failed to fetch balance

  /generate-asset-name:
    post:
      tags:
        - Utility
      summary: Generate random asset name
      description: |
        Automatically generates a unique asset identifier for minting.
        Optionally specify a prefix (e.g., "myorg-" for organization assets).

      operationId: generateAssetName
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prefix:
                  type: string
                  example: "myorg-"
                  description: Optional prefix for the generated name

      responses:
        '200':
          description: Generated asset name
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset:
                    type: string
                    example: "myorg-1234567890"

  /health:
    get:
      tags:
        - Utility
      summary: Health check
      description: |
        Checks if the Counterparty server is reachable.

      operationId: healthCheck
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  counterparty_url:
                    type: string
                    example: "http://localhost:4000"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      x-basicAuthCookie: true

security:
  - basicAuth: []
